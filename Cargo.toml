[package]
name = "rustorrent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
hex = "0.4.3"
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
thiserror = "2"
url = "2.5.8"
urlencoding = "2.1.3"
